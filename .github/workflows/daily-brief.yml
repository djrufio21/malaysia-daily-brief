name: Daily news brief

on:
  schedule:
    # GitHub cron runs in UTC. 22:17 UTC = 6:17 AM Malaysia time.
    # Off the hour on purpose: GitHub delays jobs queued at :00.
    - cron: "17 22 * * *"
  workflow_dispatch: # adds a "Run workflow" button on the Actions tab

permissions:
  contents: write # needed only to commit the new brief back to the repo

concurrency:
  group: daily-brief
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build today's brief
        run: python digest.py

      - name: Commit today's brief
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs digests
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git commit -m "Daily brief $(TZ=Asia/Kuala_Lumpur date +%F)"
          git push
